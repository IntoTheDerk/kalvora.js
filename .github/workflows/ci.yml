name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            proto/package-lock.json
      - run: npm ci
      - run: npm ci --prefix proto
      - run: npm run build:proto
      - run: npm run validate
      - run: npm run build

  attribution:
    name: no AI attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages and PR description
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='(co-authored-by:.*(claude|anthropic|openai|codex|chatgpt|copilot|gemini|cursor))|generated with \[?(claude|codex|chatgpt|copilot|cursor)'
          fail=0
          if git log --format='%H%n%B' "$BASE..$HEAD" | grep -Eiq "$pattern"; then
            echo "::error::A commit message contains an AI co-author or 'Generated with' line. Reword the commit(s) to remove it."
            git log --format='%h %s' "$BASE..$HEAD"
            fail=1
          fi
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$pattern"; then
            echo "::error::The PR title or description contains an AI attribution line. Edit the PR to remove it."
            fail=1
          fi
          exit $fail
