version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: buf.build/intothederk/kalvora-proto/gen/go
    - file_option: go_package_prefix
      value: google.golang.org/genproto/googleapis
      module: buf.build/googleapis/googleapis
plugins:
  # Generate JavaScript runtime files with TypeScript declarations
  # v2 protoc-gen-es generates messages, enums, services, and schemas natively
  - local: protoc-gen-es
    out: generated
    opt: 
      - target=js+dts
      - import_extension=.js
      - keep_empty_files=true
    include_imports: true
    include_wkt: true
