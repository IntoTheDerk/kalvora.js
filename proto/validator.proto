syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "txn.proto";

package kal_validator;

option optimize_for = SPEED;

service ValidatorService{
    // Attestation: individually authenticated votes, aggregate certificates,
    // and proposal metadata. Block bodies use the bounded block fetch RPC.
    rpc AttestationExchange(ConsensusExchange) returns (ConsensusExchange);
    rpc ConsensusBlock(ConsensusBlockRequest) returns (Block);
    // Read-only, bounded recovery proof for a validator that missed a commit.
    // The caller verifies the returned quorum certificate against its own set.
    rpc ConsensusFinality(ConsensusFinalityRequest) returns (QuorumCertificate);
    //streams
    rpc StreamFailedBlock(stream DataChunk) returns (google.protobuf.Empty);
    rpc StreamBroadcast(stream DataChunk) returns (google.protobuf.Empty);
    rpc SyncBlockchain(BlockSync) returns (stream DataChunk);
    rpc StreamGossip(stream DataChunk) returns (google.protobuf.Empty);

    rpc Broadcast(Block) returns (google.protobuf.Empty);
    rpc ValidatorRegistration(kal_txn.ValidatorRegistration) returns (google.protobuf.Empty);
    rpc SyncValidatorList(ValidatorSyncRequest) returns (ValidatorSync);
    rpc ValidatorMint(kal_txn.MintTXN) returns (google.protobuf.Empty);
    rpc ValidatorItemMint(kal_txn.ItemizedMintTXN) returns (google.protobuf.Empty);
    rpc ValidatorContract(kal_txn.InstrumentContract) returns (google.protobuf.Empty); 
    rpc ValidatorGovernProposal(kal_txn.GovernanceProposal) returns (google.protobuf.Empty);
    rpc ValidatorGovernVote(kal_txn.GovernanceVote) returns (google.protobuf.Empty);
    rpc ValidatorSmartContract(kal_txn.SmartContractTXN) returns (google.protobuf.Empty);
    rpc ValidatorSmartContractInstantiate(kal_txn.SmartContractInstantiateTXN) returns (google.protobuf.Empty);
    rpc ValidatorSmartContractExecute(kal_txn.SmartContractExecuteTXN) returns (google.protobuf.Empty);
    rpc ValidatorExpenseRatio(kal_txn.ExpenseRatioTXN) returns (google.protobuf.Empty);
    rpc ValidatorNFT(kal_txn.NFTTXN) returns (google.protobuf.Empty);
    rpc ValidatorContractUpdate(kal_txn.ContractUpdateTXN) returns (google.protobuf.Empty);
    rpc ValidatorHeartbeat(kal_txn.ValidatorHeartbeat) returns (google.protobuf.Empty);
    rpc ValidatorDelegatedVoting(kal_txn.DelegatedTXN) returns (google.protobuf.Empty);
    rpc IndexerVoting(IndexerVotingRequest) returns (IndexerVotingResponse);
    rpc ValidatorRevoke(kal_txn.RevokeTXN) returns (google.protobuf.Empty);
    rpc ValidatorCompliance(kal_txn.ComplianceTXN) returns (google.protobuf.Empty);
    rpc ValidatorBurnSBT(kal_txn.BurnSBTTXN) returns (google.protobuf.Empty);
    rpc Nonce(NonceRequest) returns (NonceResponse);
    rpc ValidatorCoin(kal_txn.CoinTXN) returns (google.protobuf.Empty);
    rpc StreamBlockAttestation(stream DataChunk) returns (stream DataChunk);
    rpc StreamRequestSlashed(stream SlashedRequest) returns (stream DataChunk);
    rpc Balance(BalanceRequest) returns (BalanceResponse);
    rpc Gossip(TXNGossip) returns (google.protobuf.Empty);
    // V2 receipts identify only children durably admitted by this receiver.
    rpc GossipV2(GossipV2Request) returns (GossipV2Receipt);
    rpc ValidatorAllowance(kal_txn.AllowanceTXN) returns (google.protobuf.Empty);
    rpc ValidatorProposalCancel(kal_txn.ProposalCancelTXN) returns (google.protobuf.Empty);
    
    // Checkpoint sync for new validators
    rpc GetCheckpointInfo(CheckpointInfoRequest) returns (CheckpointInfo);
    rpc StreamCheckpoint(CheckpointRequest) returns (stream CheckpointChunk);
}

message FeeToken{
    string stable_value_allowed = 1; //1000000000000000000 = $1.00
    string rate = 2; //1000000000000000000 = $1.00
    string value_used = 3; //1000000000000000000 = $1.00
    optional string max_stake = 4; //1000000000000000000 = $1.0
    bool authorized = 5; //true = authorized, false = not authorized
    bool whitelisted = 6; //true = whitelisted, false = not whitelisted
    string contract_id = 7; //contract_id of the token
}

message AllowanceState{
    optional string allowed_currency_equivalent = 1; //1000000000000000000 = $1.00 can only have either this or allowed_amount
    optional string allowed_amount = 2;              //Amount of parts of token can only have either this or allowed_currency_equivalent
    optional uint32 period_months = 3;               //How many months until this allowance resets, can only have this or period_seconds
    optional uint32 period_seconds = 4;              //How many seconds until this allowance resets, can only have this or period_months
    google.protobuf.Timestamp period_end = 5;        //When the allowance period ends, and will reset
    google.protobuf.Timestamp start_time = 6;        //the very first time a allowance period started
    string used_amount = 9;                          //Amount of the allowance that has been used
    kal_txn.PublicKey public_key = 10;              //Public key of the wallet that this allowance is for
}
//Key = Block Height
message ValidatorArchive
{
    map<string, ValidatorBalance> validators = 1; //Key = gen public key
    string total_balance = 2;                     //Total Balance of all validators
}
message ValidatorBalance
{
    kal_txn.PublicKey public_key = 1;            //Original Public Key
    string total_balance = 2;                     //Total Balance of all qualified coins
    kal_txn.AttestationKey attestation_key = 3;
    bytes operational_public_key = 4;
    string endpoint = 5;
    uint64 last_heartbeat_time_seconds = 6;
}

// A signer attests to its own durable nonreceipt in the closed, ten-minute-
// aligned two-hour window ending at cutoff_seconds. This is not a proof that
// no heartbeat existed anywhere on the network.
message ValidatorAbsenceStatement {
    uint32 protocol_version = 1;
    bytes chain_id = 2;
    uint64 anchor_height = 3;
    bytes anchor_hash = 4;
    bytes anchor_validator_set_hash = 5;
    bytes target_operational_key = 6;
    uint64 target_last_heartbeat_seconds = 7;
    uint64 cutoff_seconds = 8;
}
message ValidatorAbsenceVote {
    ValidatorAbsenceStatement statement = 1;
    uint32 validator_index = 2;
    bytes signature = 3;
}
message ValidatorAbsenceCertificate {
    ValidatorAbsenceStatement statement = 1;
    bytes signer_bitmap = 2;
    bytes signature = 3;
}
message ValidatorHeartbeatWitnessEpoch {
    uint64 epoch_start_seconds = 1;
    uint64 first_receipt_seconds = 2;
    uint64 last_receipt_seconds = 3;
}
message ValidatorHeartbeatWitnessJournal {
    bytes validator_identity = 1;
    repeated ValidatorHeartbeatWitnessEpoch epochs = 2;
}
message ValidatorAbsenceSigningJournal {
    bytes chain_id = 1;
    bytes target_operational_key = 2;
    uint64 cutoff_seconds = 3;
    repeated ValidatorAbsenceVote intents = 4;
}
message ValidatorAbsenceClockJournal {
    uint64 highwater_seconds = 1;
}

// Consensus uses raw bytes throughout. A height is one validator-set epoch:
// the finalized parent's archive determines every key and weight at that height.
enum ConsensusPhase {
    CONSENSUS_PHASE_UNSPECIFIED = 0;
    PREVOTE = 1;
    PRECOMMIT = 2;
}
message ConsensusVote {
    uint32 protocol_version = 1;
    bytes chain_id = 2;
    uint64 height = 3;
    uint64 round = 4;
    ConsensusPhase phase = 5;
    bytes validator_set_hash = 6;
    bytes block_hash = 7; // empty denotes nil
    uint32 validator_index = 8;
    bytes signature = 9;
}
message QuorumCertificate {
    uint32 protocol_version = 1;
    bytes chain_id = 2;
    uint64 height = 3;
    uint64 round = 4;
    ConsensusPhase phase = 5;
    bytes validator_set_hash = 6;
    bytes block_hash = 7;
    bytes signer_bitmap = 8; // little-endian bits, canonical sorted validator set
    bytes signature = 9;
}
message ConsensusProposal {
    uint32 protocol_version = 1;
    bytes chain_id = 2;
    uint64 height = 3;
    uint64 round = 4;
    bytes validator_set_hash = 5;
    bytes block_hash = 6;
    uint32 proposer_index = 7;
    optional QuorumCertificate valid_certificate = 8;
    bytes signature = 9; // proposer BLS signature over canonical proposal context
}
message ConsensusExchange {
    repeated ConsensusVote votes = 1;
    repeated QuorumCertificate certificates = 2;
    repeated ConsensusProposal proposals = 3;
    uint64 height = 4;
    bytes validator_set_hash = 5;
    repeated bytes known_ids = 6;
    // The complete envelope (including known_ids and every nested object) is
    // signed with the sender's committed attestation key. Responses echo the
    // request challenge and use a separate signature domain.
    uint32 sender_validator_index = 7;
    uint32 recipient_validator_index = 8;
    uint64 sender_boot_epoch = 9;
    uint64 sender_sequence = 10;
    bytes request_challenge = 11;
    bytes signature = 12;
    repeated ValidatorAbsenceVote absence_votes = 13;
    repeated ValidatorAbsenceCertificate absence_certificates = 14;
}
message ConsensusBlockRequest {
    bytes block_hash = 1;
}
message ConsensusFinalityRequest {
    uint64 height = 1;
}
// Finalized evidence is transported alongside synced blocks, never inferred
// from a peer's assertion that a block has been confirmed.
message FinalizedConsensusBlock {
    Block block = 1;
    QuorumCertificate certificate = 2;
}
message BlockAttestationResponse
{
    bool support = 1;                                //hash of block to support
    bool no_preference = 2;                          //if validator has no preference
    optional Block supported_block = 3;              //block that they support if they dont agree
    repeated ValidatorSupport validator_support = 4; //all validators that support either new block or same block
    kal_txn.PublicKey public_key = 5;               //public key of validator in favour
    bytes signature = 6;                             //signature of this transaction
    bool confirmed = 7;                              //if the block has been confirmed
}
message BlockAttestation{
    bytes block_hash = 1;                            //hash of block to support
    uint32 block_height = 2;                         //height of block to support
    bytes previous_block_hash = 3;                   //hash of previous block
    repeated ValidatorSupport validator_support = 4; //all validators that support block
    kal_txn.PublicKey public_key = 5;               //public key of validator in favour
    bytes signature = 6;                             //signature of this transaction
    bool confirmed = 7;                              //if the block has been confirmed
}

//Key = Block Height
message AttestationLedger{
    map<string, AttestationSupport> block_attestation_responses = 1; //all of the attestation responses for a block recieved from other validators key = block hash
    map<string, string> validator_support = 2;                       //shows how much support that block has key = block hash
}

message AttestationSupport
{
    repeated ValidatorSupport validator_support = 1; //all validators that support block
    optional Block supported_block = 2;              //block that they support if they dont agree

}
message ValidatorSupport{
    kal_txn.PublicKey public_key = 1;       //public key of validator in favour
    bytes signature = 2;                     //signature of block_hash
    google.protobuf.Timestamp timestamp = 3; //timestamp of support
}
message NonceRequest{
    bytes wallet_address = 1;
}

message NonceResponse{
    uint64 nonce = 1;
}

message DataChunk{
    bytes chunk_data = 1;
    int32 chunk_number = 2;
    optional int32 total_chunks = 3;
}
message ValidatorSyncRequest {
    kal_txn.PublicKey public_key = 1; 
    bytes signature = 2;
}
message ValidatorSync{
    repeated kal_txn.Validator validators = 1;
    optional bytes signature = 2;
    kal_txn.PublicKey public_key = 3; 
}

message BlockSync{
    bytes last_key = 1;
    uint64 amount = 2;
    optional bytes signature = 3;
    kal_txn.PublicKey public_key = 4; 
    bytes challenge = 5; // fresh 32-byte request challenge
}
message BlockHeader{
	optional uint64 version = 1;
	optional bytes previous_block_hash = 2;
    optional bytes hash = 3;
	google.protobuf.Timestamp timestamp = 4;
	uint64 nonce = 5;
	uint64 block_height = 6;
    bytes fee_address = 7;
    optional bytes signature = 8;
    optional bytes merkle_root = 9;
    kal_txn.PublicKey public_key = 10; 
}
message Block{
	optional BlockHeader block_header = 1;
	kal_txn.TXNS transactions = 2;
	optional bytes signature = 4;
    kal_txn.PublicKey public_key = 5; 
    repeated SlashedValidator slashed_validators = 6;
    repeated ValidatorAbsenceCertificate validator_expiry_certificates = 7;
}
message SlashedValidator
{
    kal_txn.PublicKey public_key = 1;
    bytes slashed_block_hash = 2;
    repeated SlashedToken slashed_tokens = 3;
}
message SlashedRequest
{
    bytes slashed_block_hash = 1;
}
message SlashedToken
{
    string contract_id = 1;
    string amount = 2;
}
message BlockBatch{
    repeated Block blocks = 1;
    bool last_block = 2;
    optional bytes signature = 3;
    kal_txn.PublicKey public_key = 4; 
    repeated QuorumCertificate finality_certificates = 5;
    bytes request_challenge = 6;
    bytes requested_parent_hash = 7;
    uint64 committed_tip_height = 8;
    bytes committed_tip_hash = 9;
}

message ConsensusJournal {
    bytes chain_id = 1;
    uint64 height = 2;
    bytes core_snapshot = 3;
    repeated ConsensusProposal signed_proposals = 4;
    ConsensusExchange evidence = 5;
}

// Local crash checkpoint for append-only absence evidence in signing.journal.
// This is never sent over the network or included in a consensus signature.
message ConsensusJournalAppendIndex {
    bytes base_digest = 1;
    uint64 base_size = 2;
    uint64 committed_size = 3;
    bytes pending_base_digest = 4;
    uint64 pending_base_size = 5;
    bool pending = 6;
    uint32 version = 7;
    bytes checksum = 8;
    // Hash chain of complete appended evidence fields, rooted at base_digest.
    // Startup checks this before accepting the committed append prefix.
    bytes committed_digest = 9;
}

message NFT{
    bytes holder_address = 1;
    string contract_id = 2;
    string item_id = 3;
    optional string voting_weight = 4;
    optional kal_txn.ItemContractFees contract_fees = 5;
    repeated kal_txn.KeyValuePair parameters = 6;
    optional uint64 expiry = 7;
    optional uint64 valid_from = 8;
}

message Item{
    string contract_id = 1;
    string item_id = 2;
}
message WalletItems{
    repeated Item items = 1;
}
message ProcessLedger{
    repeated string cycle_contract_ids = 1; //canonical Base58 contract IDs that need proposals processed
    repeated bytes proposal_ids = 2;       //all staggered proposals that need to be processed
}
//message for a ledger to determine proposal_ids for contracts
//used to process cycle/staged governance
// Key = contract_id
message ProposalLedger{
    repeated bytes proposal_ids = 1;                //proposals that need to be processed at the end of this cycle
    repeated bytes pending_proposal_ids = 2;        //proposals that need to be put into the next cycle
    repeated bytes process_proposal_ids = 3;        //not sure yet
    uint32 stage = 4;                               //what stage we are currently on
    google.protobuf.Timestamp cycle_end_date = 5;   //the date the cycle will end at
    google.protobuf.Timestamp cycle_start_date = 6; //the date the cycle will start at
    google.protobuf.Timestamp stage_end_date = 7;   //the date the stage will end at
    google.protobuf.Timestamp stage_start_date = 8; //the date the stage will start at
    bool break = 9;
}
message Vote{
    map<string, string> vote = 1;
}
enum PROPOSAL_PHASE {
    REGULAR_GOVERNANCE = 0;
    PRE_GOVERNANCE = 1;
}
enum PRE_GOVERNANCE_OUTCOME {
    PRE_GOVERNANCE_ACTIVE = 0;
    PRE_GOVERNANCE_PROMOTION_PENDING = 1;
}
message Voter{
    optional bool support = 1;
    optional uint32 option = 2;
    bool delegated = 3;
    optional uint64 stage = 4;
    PROPOSAL_PHASE phase = 5;
}

//which proposals have been voted on with this wallet.
message VoteWallet{
    map<string, Voter> proposal_votes = 1;
}
message Proposal{
    string contract_id = 1;
    map<string, string> yes = 4;    //all votes for yes of each currency
    map<string, string> no = 5;     //all votes for no of each currency
    map<uint32, Vote> options = 6; //all votes for each option of each currency
    uint32 stage = 7;
    string fee = 8;
    string fee_id = 9;
    bytes wallet = 10;
    map<string, Voter> voters = 11; //wallets and amounts of each currency wallet has
    optional google.protobuf.Timestamp start_date = 12;
    optional google.protobuf.Timestamp end_date = 13;
    kal_txn.PublicKey public_key = 14; 
    bool options_set = 15;
    uint32 number_of_options = 16;
    repeated kal_txn.GovernanceTXN governance_txn = 17;
    repeated kal_txn.GovernanceOptionTXNS governance_option_txns = 18;
    PROPOSAL_PHASE phase = 19;
    optional google.protobuf.Timestamp pre_governance_start_date = 20;
    optional google.protobuf.Timestamp pre_governance_end_date = 21;
    optional google.protobuf.Timestamp requested_regular_start_date = 22;
    string pre_governance_fee = 23;
    string regular_governance_fee = 24;
    PRE_GOVERNANCE_OUTCOME pre_governance_outcome = 25;
    // Refund destination for any unspent proposal fee escrow on voted removal.
    optional bytes escrow_payer_wallet = 26;
}
message ProposalWalletRecieve{
    kal_txn.BaseTXN base = 1;
    bytes wallet_adr = 2;
    string contract_id = 3;
    string amount = 4;
}

message ProposalWalletSend{
    kal_txn.BaseTXN base = 1;
    bytes wallet_adr = 2;
    string contract_id = 3;
    repeated bytes recipient_wallet = 4;
    repeated string amounts = 5;
}
message CurrencyRate{
    bool qualified = 1;
    string rate = 2; //1000000000000000000 = $1.00
    optional string max_stake = 3; //1000000000000000000 = $1.00 (10^18)
}
message ExpenseTracker{
    int32 day = 1;
    int32 month = 2;
    int32 year = 3; // Full UTC Gregorian year of the last processed expense
}
message IndexerVotingRequest{
    bytes proposal_id = 1;
}

//THIS IS NOT A PART OF ACTUAL VALIDATOR
message IndexerOption{
    repeated IndexerVote votes = 1;
    uint32 index = 2;
}
message IndexerVote{
    string contract_id = 1;
    string amount = 2;
}
message IndexerVotingResponse{
    repeated IndexerVote support = 1;    //all votes for yes of each currency
    repeated IndexerVote against = 2;     //all votes for no of each currency
    repeated IndexerOption options = 3;  //all votes for each option of each currency
    uint32 stage = 4;
}
message DelegationFees{
    map<string, string> authorized_fees =3;
}
message AuthorizedFee{
    uint32 priority = 1;
    string authorized_amount = 2;
}

message Delegator{
    kal_txn.PublicKey public_key = 1; 
    uint32 priority = 2;
}

message DelegatedFees{
    repeated string contract_ids = 1;  
}

message Delegators{
    repeated Delegator delegator = 1; 
}


//databaase db_delegate_recipient key = contract_id, value = DelegatedRecipient 
message DelegatedRecipient{ 
    map<string, Delegators> delegations = 1; //key = contract_id, value = Delegator
}

//database db_voted_proposals key = public_key, value = VotedProposals
message Delegated{
    map<string, uint32> proposals = 1; //key = proposal_id encoded, value = priority
}
message DelegateeWallets{
    repeated bytes wallet_adr = 1;
}
//database db_delegatees key = public_key, value = Delegatees
message Delegatees{
    map<string, DelegateeWallets> delegated_wallets = 1; //key = contract_id, value = DelegateeWallets
}
message DelegateWallets{
    repeated bytes wallets = 1;
    // Aligned with wallets; the delegator's priority on the traversed edge.
    repeated uint32 priorities = 2;
}
//key = proposal_id
message ComplianceData
{
    uint32 level = 1;
    google.protobuf.Timestamp expiry = 2;
}
message ComplianceLevels{
    repeated ComplianceData levels = 1;
}
//Key = wallet_address
message WalletLookup{
    map<string, ComplianceLevels> compliance = 1;    //compliance level of wallet of each contract
}
//the dates the next cycle will end at.
message ProposalProcess{
    kal_txn.GOVERNANCE_TYPE type = 1;
    uint32 stage = 2;
    uint32 total_stages = 3;
    google.protobuf.Timestamp end_date = 4;
    google.protobuf.Timestamp start_date = 5;

}
message TXNTracker{
    repeated bytes txn_ids = 1;
}
//key = wallet_address + contract_id
message PreProcessedWallets
{
    string amount = 1;
    
}
message KalGovernanceAuth{
    kal_txn.PublicKey public_key = 1;
    kal_txn.TRANSACTION_TYPE type = 2;
}

message ContractPrice{
    string symbol = 1;
    uint32 number_of_symbols = 2;
    string multiplier = 3;
}

message BalanceTracker{
    map<string, string> wallet_balances = 1; // Key: wallet address, Value: balance as string
    // repeated bytes wallet_addresses = 1;
    // repeated string balances = 2;
}
message TokenLookup{
    repeated string tokens = 1;
}
message BalanceRequest{
    bytes wallet_address = 1;
    string contract_id = 2;
    bool encoded = 3;
}
message BalanceResponse{
    string balance = 1;
}

message TXN{
    kal_txn.TRANSACTION_TYPE txn_type = 1;
    bytes serialized_txn = 2;
}
message TXNGossip{
    repeated TXN txns = 1;
    kal_txn.PublicKey public_key = 2;
    optional bytes signature = 3;
}
message GossipV2Request {
    uint32 version = 1;
    bytes chain_id = 2;
    bytes challenge = 3;
    repeated TXN txns = 4;
    kal_txn.PublicKey sender_public_key = 5;
    bytes batch_digest = 6;
    bytes signature = 7;
}
message GossipV2Receipt {
    uint32 version = 1;
    bytes chain_id = 2;
    bytes challenge = 3;
    bytes batch_digest = 4;
    kal_txn.PublicKey sender_public_key = 5;
    kal_txn.PublicKey receiver_public_key = 6;
    repeated uint32 accepted_indices = 7;
    bytes signature = 8;
}

// Checkpoint Sync Messages
message CheckpointRequest {
    string version = 1;                          // Version identifier (e.g., "v100002")
    kal_txn.PublicKey public_key = 2;           // Requesting validator's public key
    google.protobuf.Timestamp timestamp = 3;     // Request timestamp (prevents replay attacks)
    bytes signature = 4;                         // Signature of (version + timestamp)
}

message CheckpointInfoRequest {
    kal_txn.PublicKey public_key = 1;
    google.protobuf.Timestamp timestamp = 2;     // Request timestamp (prevents replay attacks)
    bytes signature = 3;                         // Signature of timestamp
}

message CheckpointInfo {
    string version = 1;                          // Current checkpoint version
    uint64 block_height = 2;                     // Block height at checkpoint
    bytes block_hash = 3;                        // Block hash for verification
    uint64 total_size = 4;                       // Total tar.gz file size in bytes
    google.protobuf.Timestamp created_at = 5;    // When checkpoint was created
    bytes file_hash = 6;                         // SHA3-256 hash of the checkpoint tar.gz file
    kal_txn.PublicKey public_key = 7;           // Original public key of the validator that created/signed this checkpoint
    bytes signature = 8;                         // Signature over this message (signature field excluded) by public_key
}

message CheckpointChunk {
    bytes data = 1;                              // Raw tar.gz chunk data
    uint64 offset = 2;                           // Byte offset in file
    uint64 total_size = 3;                       // Total file size
    bool is_last = 4;                            // Last chunk indicator
}

message KeyPair{
    bytes public_key = 1;
    bytes private_key = 2;
}
